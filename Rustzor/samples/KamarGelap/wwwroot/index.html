<body>
  <div id="app"><div class="kg-loading app-loading"><span>Kamar Gelap</span>Turning on the safelight…</div></div>
  <script type="module">
    import { start } from "./_rustzor/rustzor.js";
    start().catch((e) => {
      document.getElementById("app").innerHTML = "<pre class='kg-error app-error'></pre>";
      document.querySelector(".app-error").textContent = e.message;
      console.error(e);
    });
  </script>
