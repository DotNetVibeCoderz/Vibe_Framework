<body>
  <div id="app"><div class="lk-boot app-loading"><b>A-···</b><span>Membuka loket…</span></div></div>
  <script type="module">
    import { start } from "./_rustzor/rustzor.js";
    start().catch((e) => {
      document.getElementById("app").innerHTML = "<pre class='lk-boot-error app-error'></pre>";
      document.querySelector(".app-error").textContent = e.message;
      console.error(e);
    });
  </script>
