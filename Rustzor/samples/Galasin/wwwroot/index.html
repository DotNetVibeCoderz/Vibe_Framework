<body>
  <div id="app"><div class="gl-boot app-loading"><b>Galasin</b><span>Menggaris lapangan…</span></div></div>
  <script type="module">
    import { start } from "./_rustzor/rustzor.js";
    start().catch((e) => {
      document.getElementById("app").innerHTML = "<pre class='gl-boot-error app-error'></pre>";
      document.querySelector(".app-error").textContent = e.message;
      console.error(e);
    });
  </script>
