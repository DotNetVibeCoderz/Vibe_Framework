<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="/" />
  <title>Arus Grid Operations · Rustzor sample</title>
  <meta name="description" content="Built with Rustzor by Gravicode Studios, led by Kang Fadhil." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="app.css" />
  <link rel="stylesheet" href="grid.css" />
</head>
<body>
  <div id="app"><div class="app-loading">Loading…</div></div>
  <script type="module">
    import { start } from "./_rustzor/rustzor.js";
    start().catch((e) => {
      document.getElementById("app").innerHTML = "<pre class='app-error'></pre>";
      document.querySelector(".app-error").textContent = e.message;
      console.error(e);
    });
  </script>
</body>
</html>
