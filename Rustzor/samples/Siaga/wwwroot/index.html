<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <base href="/" />
  <title>Siaga Citarum · Rustzor sample</title>
  <meta name="description" content="A flood-response map of the Citarum basin in the browser, built with Rustzor by Gravicode Studios, led by Kang Fadhil." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%275%27 fill=%27%23f4f6f1%27/%3E%3Cpath d=%27M4 12c3-3 6-3 9 0s6 3 9 0 5-3 6-3M4 18c3-3 6-3 9 0s6 3 9 0 5-3 6-3%27 stroke=%27%232f74b5%27 stroke-width=%272.4%27 fill=%27none%27/%3E%3Cpath d=%27M16 6 23 26H9z%27 fill=%27%23e2621b%27/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@1,8..60,500;1,8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="app.css" />
  <link rel="stylesheet" href="siaga.css" />
</head>
<body>
  <div id="app"><div class="sg-boot app-loading"><b>Siaga Citarum</b><span>Unrolling the map sheet…</span></div></div>
  <script type="module">
    import { start } from "./_rustzor/rustzor.js";
    start().catch((e) => {
      document.getElementById("app").innerHTML = "<pre class='sg-boot-error app-error'></pre>";
      document.querySelector(".app-error").textContent = e.message;
      console.error(e);
    });
  </script>
</body>
</html>
