<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="/" />
  <title>Ruang Redaksi · Rustzor sample</title>
  <meta name="description" content="Video calls between browser tabs, built with Rustzor by Gravicode Studios, led by Kang Fadhil." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Extra+Condensed:wght@600;700;800&family=Onest:wght@400;500;600;700&family=Martian+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="app.css" />
  <link rel="stylesheet" href="meet.css" />
</head>
<body>
  <div id="app"><div class="app-loading">Opening the studio…</div></div>
  <script type="module">
    import { start } from "./_rustzor/rustzor.js";
    start().catch((e) => {
      document.getElementById("app").innerHTML = "<pre class='app-error'></pre>";
      document.querySelector(".app-error").textContent = e.message;
      console.error(e);
    });
  </script>
</body>
</html>
