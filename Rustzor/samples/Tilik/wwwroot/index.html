<body>
  <div id="app"><div class="tk-boot app-loading"><b>Tilik</b><span>Opening the review…</span></div></div>
  <script type="module">
    import { start } from "./_rustzor/rustzor.js";
    start().catch((e) => {
      document.getElementById("app").innerHTML = "<pre class='tk-boot-error app-error'></pre>";
      document.querySelector(".app-error").textContent = e.message;
      console.error(e);
    });
