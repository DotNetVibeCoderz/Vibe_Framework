[package]
name = "rustnet-npc-sample"
description = "Sample NPC (Native Procedure Caller) module: native Rust procedures a C# app loads at run time"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# A dynamic library for the host/virtual device. Real silicon takes a
# position-independent blob instead; see docs/npc.md.
crate-type = ["cdylib"]
