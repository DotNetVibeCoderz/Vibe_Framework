[package]
name = "rustnet-firmware-esp32"
description = "RustNet firmware for ESP32 (Xtensa) on ESP-IDF: the std service stack served over UART0 RNDP"
version = "0.1.0"
edition = "2021"
resolver = "2"

# Standalone workspace: built with the Espressif Rust toolchain
# (rust-toolchain.toml channel "esp"), not the host workspace.
[workspace]

[[bin]]
name = "rustnet-firmware-esp32"
harness = false

[dependencies]
esp-idf-svc = "0.51"
rustnet-firmware = { path = "../firmware", default-features = false }
rustnet-hal = { path = "../rustnet-hal", features = ["std"] }
rustnet-fs = { path = "../rustnet-fs" }
rustnet-secureboot = { path = "../rustnet-secureboot" }
rustnet-npc = { path = "../rustnet-npc" }
rustnet-diag = { path = "../rustnet-diag" }
# NimBLE GATT server for RNDP over BLE (`--features ble`). Pinned to the last
# release built against esp-idf-svc 0.51 — 0.12 moved to 0.52, 0.13 to 0.53.
esp32-nimble = { version = "=0.11.1", optional = true }

[features]
default = ["chip-esp32"]
# Which SoC this image is for. It picks the chip identity the service reports
# *and* the peripheral RNDP runs over: the classic ESP32 boards reach a host
# through a USB-serial bridge on UART0, while the C3 has a USB Serial/JTAG
# controller inside the SoC and its boards wire the socket straight to that.
# See src/link.rs.
chip-esp32 = ["rustnet-firmware/chip-esp32"]
chip-esp32c3 = ["rustnet-firmware/chip-esp32c3"]
# The M5Stack panel boards. Tough and Core2 carry the same ILI9342C on the
# same pins behind the same AXP192, so the bring-up is shared under `board-m5`
# and only the rails that differ are split — see `m5_axp192_init`.
board-m5 = []
board-m5tough = ["board-m5"]
board-m5core2 = ["board-m5"]
# RNDP over Bluetooth LE: a Nordic-UART-style GATT server (src/ble.rs). Off
# by default — NimBLE costs flash and, on the classic ESP32, DRAM the
# controller reserves. It also needs Bluetooth switched on in the ESP-IDF
# config, which a cargo feature cannot do (see sdkconfig.defaults.ble and
# docs/ble.md; build.rs stops a `ble` build that lacks it):
#   $env:ESP_IDF_SDKCONFIG_DEFAULTS = "$PWD\sdkconfig.defaults;$PWD\sdkconfig.defaults.ble"
#   cargo build --release --features ble
ble = ["dep:esp32-nimble"]

[build-dependencies]
embuild = "0.33"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"
