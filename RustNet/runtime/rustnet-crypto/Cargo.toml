[package]
name = "rustnet-crypto"
description = "Crypto primitives: AES, SHA, HMAC, RSA (hardware-accel hooks later)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Host builds keep std, for `std::error::Error` and the faster big-integer
# paths. Bare-metal firmware takes `default-features = false`; everything the
# crate exposes works on alloc alone.
default = ["std"]
std = ["rsa/std", "sha2/std", "hmac/std"]

[dependencies]
aes.workspace = true
ctr.workspace = true
sha2.workspace = true
hmac.workspace = true
rsa.workspace = true

[dev-dependencies]
rand.workspace = true
